name: release

# Pushing a tag like v1.2.0 builds both programs and publishes a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          # Self-contained single files for x86: no .NET runtime needed on the target machine.
          $common = @('-c', 'Release', '-r', 'win-x86', '--self-contained', 'true',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
                      '-p:EnableCompressionInSingleFile=true', '-p:DebugType=none')
          dotnet publish FLTestClient.Gui/FLTestClient.Gui.csproj @common -o out/gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish FLTestClient.Cli/FLTestClient.Cli.csproj @common -o out/cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item out/*/*.xml
          Copy-Item README.md, LICENSE out/gui
          Copy-Item README.md, LICENSE out/cli
          Compress-Archive out/gui/* "FLTestClientGui-$version-win-x86.zip"
          Compress-Archive out/cli/* "FLTestClient-cli-$version-win-x86.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create $version --title "FLTestClient $version" --generate-notes @flags `
            "FLTestClientGui-$version-win-x86.zip" "FLTestClient-cli-$version-win-x86.zip"
